name: altium-lib

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Ouvert pour qu'Altium lise la base via ODBC (compte lecture seule).
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - libdata:/data
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  samba:
    build: ./samba
    restart: unless-stopped
    env_file: .env
    volumes:
      # Lecture seule : les postes Altium lisent les SchLib/PcbLib, seule l'application écrit.
      - libdata:/data:ro
    ports:
      - "${SMB_PORT:-445}:445"
    depends_on:
      - app

volumes:
  pgdata:
  libdata:
