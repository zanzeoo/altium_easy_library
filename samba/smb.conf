[global]
   workgroup = ${SMB_WORKGROUP}
   server string = Bibliotheque Altium
   server role = standalone server
   security = user
   map to guest = never
   server min protocol = SMB2_10
   smb ports = 445
   disable netbios = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log file = /dev/stdout
   log level = 1

# Bibliothèque en lecture seule : seule l'application web écrit dans ce dossier.
[${SMB_SHARE}]
   path = /data/lib
   comment = Bibliotheque Altium (lecture seule)
   browseable = yes
   read only = yes
   guest ok = no
   valid users = ${SMB_USER}
   veto files = /.git/
   hide dot files = yes
